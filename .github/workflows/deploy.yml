name: Build and deploy GuideHollow Sheets
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sheets-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run test:publisher
      - run: npm run check
      - run: npm run build
      - name: Test CSV safety in real Chromium
        run: npm run test:browser
      - name: Test public CSV safety before merge
        if: github.event_name == 'pull_request'
        env:
          CSV_BROWSER_TARGET: production
        run: npm run test:browser
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  verify-live:
    name: Verify public CSV safety after Pages deployment
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test deployed CSV controls in real Chromium
        env:
          CSV_BROWSER_TARGET: production
          CSV_MOBILE_REQUIRE_MENU_44: 'true'
        run: node scripts/browser-csv-smoke.mjs
